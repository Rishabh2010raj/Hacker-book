<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HackerBook - Social, Reels & Chat</title>
    <link rel="stylesheet" href="ab.css">
</head>
<body>

    <!-- AUTH SECTION (Login / Signup) -->
    <div id="authSection">
        <div class="card auth-card">
            <h1 class="brand-logo">HackerBook</h1>
            <p class="brand-sub">Connect & Share Reels with friends</p>
            <div id="authError" class="error hidden"></div>
            <input type="text" id="authUsername" placeholder="Username">
            <input type="password" id="authPassword" placeholder="Password">
            <button onclick="loginUser()" class="btn btn-primary">Log In</button>
            <hr class="divider">
            <button onclick="registerUser()" class="btn btn-secondary">Create New Account</button>
        </div>
    </div>

    <!-- MAIN APP SECTION -->
    <div id="appSection" class="hidden">
        <!-- Header / Navbar -->
        <header class="header">
            <h1>HackerBook</h1>
            <div class="nav-links">
                <a href="#" onclick="switchTab('feed')" id="navFeed" class="active-nav">🏠 Feed</a>
                <a href="#" onclick="switchTab('chat')" id="navChat">💬 Chat</a>
                <a href="#" onclick="logout()">Logout</a>
            </div>
        </header>

        <div class="container">
            <!-- TAB 1: NEWS FEED -->
            <div id="feedView">
                <!-- Create Post Box -->
                <div class="card">
                    <textarea id="postInput" placeholder="What's on your mind?"></textarea>
                    
                    <!-- File Options for Image & Video -->
                    <div class="media-upload-options">
                        <label class="media-btn">
                            📷 Photo Select
                            <input type="file" id="mediaInput" accept="image/*,video/*" hidden onchange="previewMediaName()">
                        </label>
                        <span id="fileNameDisplay" class="file-name"></span>
                    </div>

                    <button onclick="createPost()" class="btn btn-primary btn-post">Post</button>
                </div>
                <!-- Posts Feed Container -->
                <div id="postsContainer"></div>
            </div>

            <!-- TAB 2: CHAT SYSTEM (MESSENGER) -->
            <div id="chatView" class="hidden">
                <!-- Users List Screen -->
                <div id="userListCard" class="card">
                    <h2 class="section-title">Messages / Friends</h2>
                    <p class="sub-text">Select a user to start chatting:</p>
                    <div id="usersContainer"></div>
                </div>

                <!-- Chat Box Screen -->
                <div id="activeChatCard" class="card hidden">
                    <div class="chat-header">
                        <h3 id="chatWithTitle">Chat</h3>
                        <button onclick="closeChat()" class="btn-back">← Back</button>
                    </div>
                    <div id="chatBox" class="chat-box"></div>
                    <div class="chat-input-area">
                        <input type="text" id="chatInput" placeholder="Type a message...">
                        <button onclick="sendMessage()" class="btn btn-primary btn-send">Send</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="ab.js"></script>
</body>
</html>
